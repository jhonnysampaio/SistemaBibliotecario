{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Cadastrar Aluno</h3>
        </div>


        <div class="card-body">

            <form method="POST">

                {% csrf_token %}


                <div class="row">


                    {% for field in form %}

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            {{ field.label }}
                        </label>


                        {{ field }}


                        {% if field.errors %}

                        <div class="text-danger">
                            {{ field.errors }}
                        </div>

                        {% endif %}


                    </div>

                    {% endfor %}


                </div>


                <div class="d-flex justify-content-between mt-3">


                    <a href="{% url 'listar_aluno' %}" 
                       class="btn btn-secondary">
                        Cancelar
                    </a>


                    <button type="submit" 
                            class="btn btn-primary">
                        Cadastrar Aluno
                    </button>


                </div>


            </form>

        </div>

    </div>

</div>


{% endblock %}
