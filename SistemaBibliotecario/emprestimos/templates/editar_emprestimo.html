{% extends "base.html" %}


{% block content %}


<div class="container mt-5">


    <div class="card shadow">


        <div class="card-header bg-warning">

            <h3>
                Editar Empréstimo
            </h3>

        </div>


        <div class="card-body">


            <form method="POST">

                {% csrf_token %}


                <div class="mb-3">

                    <label class="form-label">
                        Aluno
                    </label>

                    {{ form.aluno }}

                </div>



                <div class="mb-3">

                    <label class="form-label">
                        Livro
                    </label>

                    {{ form.livro }}

                </div>



                <div class="mb-3">

                    <label class="form-label">
                        Data início
                    </label>

                    {{ form.data_inicio }}

                </div>



                <div class="mb-3">

                    <label class="form-label">
                        Data término
                    </label>

                    {{ form.data_termino }}

                </div>



                <button class="btn btn-success">
                    Atualizar
                </button>


                <a href="{% url 'listar_emprestimo' %}"
                   class="btn btn-secondary">
                    Cancelar
                </a>


            </form>


        </div>


    </div>


</div>


{% endblock %}
