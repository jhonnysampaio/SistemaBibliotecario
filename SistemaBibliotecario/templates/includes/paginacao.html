{% if pagina.paginator.num_pages > 1 %}
<nav class="panel-body border-top" aria-label="Paginação">
    <ul class="pagination mb-0 justify-content-end">
        {% if pagina.has_previous %}
            <li class="page-item">
                <a
                    class="page-link"
                    href="?q={{ q|urlencode }}&amp;situacao={{ situacao|urlencode }}&amp;page={{ pagina.previous_page_number }}"
                >
                    Anterior
                </a>
            </li>
        {% endif %}

        <li class="page-item disabled">
            <span class="page-link">
                {{ pagina.number }} de {{ pagina.paginator.num_pages }}
            </span>
        </li>

        {% if pagina.has_next %}
            <li class="page-item">
                <a
                    class="page-link"
                    href="?q={{ q|urlencode }}&amp;situacao={{ situacao|urlencode }}&amp;page={{ pagina.next_page_number }}"
                >
                    Próxima
                </a>
            </li>
        {% endif %}
    </ul>
</nav>
{% endif %}
