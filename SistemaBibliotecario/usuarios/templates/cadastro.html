<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f6f9;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            width:400px;
            background:#fff;
            padding:35px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,.15);
        }

        h2{
            text-align:center;
            color:#333;
            margin-bottom:25px;
        }

        .campo{
            margin-bottom:18px;
        }

        label{
            display:block;
            margin-bottom:6px;
            font-weight:bold;
            color:#555;
        }

        input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:15px;
            transition:.3s;
        }

        input:focus{
            outline:none;
            border-color:#4CAF50;
            box-shadow:0 0 8px rgba(76,175,80,.3);
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#4CAF50;
            color:white;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            background:#43a047;
        }

        .login{
            text-align:center;
            margin-top:20px;
        }

        .login a{
            color:#4CAF50;
            text-decoration:none;
            font-weight:bold;
        }

        .login a:hover{
            text-decoration:underline;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <h2>Criar Conta</h2>

        <form method="POST" action="{% url 'valida_cadastro' %}">
            {% csrf_token %}

            <div class="campo">
                <label>Nome</label>
                <input type="text" name="nome" placeholder="Digite seu nome" required>
            </div>

            <div class="campo">
                <label>E-mail</label>
                <input type="email" name="email" placeholder="Digite seu e-mail" required>
            </div>

            <div class="campo">
                <label>Senha</label>
                <input type="password" name="senha" placeholder="Digite sua senha" required>
            </div>

            <button type="submit">Cadastrar</button>
        </form>

        <div class="login">
            Já possui uma conta?
            <a href="{% url 'login' %}">Entrar</a>
        </div>

    </div>

</body>
</html>
